# Cloudflare Worker 설정 — 몽당(MD)연필 Gemini 교정 프록시
#
# 배포:
#   1) npm install -g wrangler
#   2) wrangler login
#   3) cd worker && wrangler deploy
#   4) wrangler secret put GEMINI_API_KEY   (Google AI Studio 키 입력)
#
# 배포 후 출력되는 https://gemini-proxy.<계정>.workers.dev 주소를
# 앱 설정(⚙️)의 "프록시 주소"에 붙여넣으면 됩니다.

name = "gemini-proxy"
main = "gemini-proxy.js"
compatibility_date = "2024-11-01"

# 허용할 사이트 origin. GitHub Pages 주소로 바꾸면 보안이 강화됩니다.
# (기본 '*'는 누구나 호출 가능 — 개인 키 보호를 위해 본인 주소로 제한 권장)
[vars]
ALLOWED_ORIGIN = "*"
GEMINI_MODEL = "gemini-2.5-flash"

# GEMINI_API_KEY 는 vars 에 넣지 말고 반드시 secret 으로 등록하세요:
#   wrangler secret put GEMINI_API_KEY
